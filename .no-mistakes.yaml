# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI invokes instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the context-sensitive ShellCheck modes and GitHub
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# Invocation wiring is asserted by `tests/fm-lint.test.sh` and
# `tests/fm-lint-workflows.test.sh`.
#
# Keep commands.test absent; the firstmate-coding-guidelines skill owns this policy.
commands:
  lint: 'bin/fm-lint.sh'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
#
# Runbook for the gate's live-evidence test agent. Without it the analyzer
# derives scenarios, proves them with this repo's own suites, and is then
# refused for reporting a "pass" it never recognized as a live drive
# (`scenario N result "pass" requires live validation`). The runbook tells the
# analyzer what this product and these suites actually are, so a genuinely
# executed scenario can be reported live and an un-executed one still cannot.
# It narrows and clarifies the gate's live-evidence policy; it never weakens it.
# Trusted-only: the analyzer reads this runbook from the default-branch copy of
# this file, so a feature branch cannot alter the active live-evidence policy.
test:
  evidence:
    store_in_repo: true
  instructions: |
    WHAT THE PRODUCT IS HERE.
    Firstmate is not a service you stand up. Its product entry points are the
    executable files under bin/ that the fleet runs as processes, whatever
    language each is written in - the bin/fm-*.sh commands and equally
    bin/fm-voice-client.py, bin/fm-voice-relay.py, bin/fm-mail.py,
    bin/fm-arm-command-policy.mjs, bin/fm-cd-command-policy.mjs and
    bin/fm-extension-launch-barrier.mjs - plus the .pi/extensions TypeScript
    editor extensions and the agent-facing contracts in AGENTS.md,
    .agents/skills/ and docs/. Being something the fleet runs is the test, not
    the language it happens to be written in. A module under bin/ that only
    gets imported, such as bin/fm_voice_frame.py, is library code those entry
    points use, not an entry point. Its end user is an operator, or a
    supervising agent, who runs those entry points against a firstmate home
    (FM_HOME) holding data/, state/, config/ and projects/. So driving a
    scenario end-to-end here means running those real entry points as real
    processes against a throwaway FM_HOME and reading what they actually did to
    that home - not importing a function, and not reasoning about the source.

    THE SUITES IN tests/ ARE THAT DRIVE, NOT UNIT TESTS.
    Most tests/<subject>.test.sh scripts build a disposable state root and git
    fixture and then run the real bin/ entry points as real subprocesses,
    asserting only what is observable through their public interfaces;
    asserting implementation source bytes is forbidden in this repo. A case
    drove the product when it exercised the shipped artefact through the real
    runtime that actually runs it, in a process the case launched. Launching
    the entry point itself qualifies, directly or through a child contract
    executable the case launches - tests/fm-inbox-conversation.test.sh drives
    bin/fm-inbox.sh that way, through tests/fm-inbox-conversation-cases.py.
    Importing a module into an interpreter the test controls and calling its
    functions does NOT qualify, even for a file the product ships, even when
    that interpreter is a child process, and even when real packages are
    symlinked beside it: the product's runtime never started. Read the case
    behind the transcript line you are about to cite and confirm what it did:
    the transcript proves the case ran and its named assertion held, never that
    it launched anything, and a script that drives entry points in its other
    cases does not make this one live. Run the few scripts that cover your
    scenarios, by path:

      bin/fm-test-run.sh tests/<subject>.test.sh [more scripts...]

    bin/fm-test-run.sh --help owns the selection and timing mechanics. Do not
    run the whole suite.

    When such a case executes a scenario, that IS driving the product live in
    this run: report the scenario "pass" with "live": true and cite the script
    and the transcript lines that case printed. Each "ok - <behavior>" line,
    and each "PASS: <behavior>" line a child contract executable prints
    through its owning .test.sh wrapper, names a behavior that was driven, and
    the closing "FM_TEST_END ... exit=0 ... gate_skip=false" proves the script
    as a whole ran, so that transcript is behavior-level evidence rather than
    generic pass/fail output. That closing marker does not prove every case
    inside the script ran, so cite the transcript line that names your
    scenario, never the marker alone. This is the standing rule that an existing
    automated test which drives a scenario end-to-end may be run as the
    scenario and cited as its evidence. It is not an exemption from live
    evidence, so apply it only to a case that actually executed here.

    THE BOUNDARY THAT STAYS REFUSED.
    Ask of every scenario: did a script execute the real surface as a process
    in this run, or did it replay a recorded fixture standing in for something
    this host cannot produce? Only the first is live. A scenario whose verdict
    depends on a real vendor agent harness rendering in a real terminal pane, a
    real network or forge call, a real remote host over SSH, or a real
    credential is NOT proven by the portable suite, which substitutes a fixture
    or a fake for exactly that. Neither is a scenario covered only by a case
    that sources a library and feeds it recorded strings: that proves the
    classifier's logic, not the live surface it was recorded from. Neither is a
    scenario covered only by a case that parses a declarative artifact - a
    YAML, JSON or config file - without running its consumer: that proves the
    artifact's shape, not that the consumer reads it, so a scenario whose
    consumer is the gate itself or any other process this run never launched
    stays untested. Report every such scenario "untested" with "live": false
    and a reason naming what was missing and how to supply it - never "pass",
    and never "live": true.

    The runner hands you that reason. bin/fm-test-run.sh classifies a script as
    a gate skip only when its FIRST meaningful line is "skip: <reason>", and
    only such a script ends with "gate_skip=true". An opt-in skip names the
    variable that would turn the guard on; a capability skip names the tool,
    harness or host requirement that was unavailable. A script may also print
    "skip: <reason>" mid-transcript when one case cannot run here while its
    other cases do; that leaves gate_skip=false for the script, so read every
    "skip:" line in the transcript and treat the case it names as untested. A
    skipped guard or case is not a met guarantee and never licenses a live
    "pass", and a fixture replaying a harness's rendered output proves only the
    assumption recorded in the fixture.

    DO NOT MANUFACTURE LIVE EVIDENCE.
    Do not set FM_LIVE, or any guard's own control variable, to force a skipped
    live guard on: those guards submit prompts to real agent harnesses and
    spend metered operator accounts without explicit authorization. Do not
    launch a real agent harness, a real second mate, or a real
    fleet worker for evidence either. bin/fm-spawn.sh, bin/fm-send.sh and
    bin/fm-teardown.sh deliberately refuse to run from a gate worktree
    (bin/fm-gate-refuse-lib.sh), and the suites reach them only for their own
    throwaway fixture homes. Never hand-set FM_GATE_REFUSE_BYPASS, and never
    point a scenario at the operator's real firstmate home. An honest
    "untested" is listed on the pull request and costs nothing; a forced or
    guessed "pass" costs everything.
